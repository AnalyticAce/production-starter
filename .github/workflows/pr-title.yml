name: PR Title

# Squash-merge uses the PR title as the commit message, so it must be a Conventional Commit.
# Local hooks can be skipped with --no-verify; this check can't.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
