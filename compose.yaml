services:
  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    env_file: .env
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./deploy/config/app.yaml:/app/config/app.yaml:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
