version: 2
# Add an entry for your package ecosystem (npm, gomod, cargo, maven, ...):
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference#package-ecosystem-
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
